##############################################################################
# Neuro-Gen — Stack completa em Docker
#
# Uso:
#   cp .env.example .env        # preencha SENSITIVE_DATA_KEY
#   docker compose -f docker-compose.full.yml --env-file .env up --build -d
#   docker compose -f docker-compose.full.yml logs -f
#
# Serviços:
#   postgres  → banco PostgreSQL 16              (interno: 5432)
#   pgadmin   → pgAdmin 4                        (host: http://localhost:5050)
#   app       → backend Spring Boot              (interno: 8080)
#   frontend  → Nginx + React build              (host: http://localhost:3000)
##############################################################################

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: neurogen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neurogen
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: neurogen
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - neurogen-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurogen -d neurogen"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── pgAdmin 4 ──────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: neurogen-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    networks:
      - neurogen-net
    depends_on:
      postgres:
        condition: service_healthy

  # ── Backend Spring Boot ────────────────────────────────────────────────────
  app:
    build:
      context: .           # raiz do repo (onde está o Dockerfile do backend)
      dockerfile: Dockerfile
    container_name: neurogen-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: neurogen
      DB_USERNAME: neurogen
      DB_PASSWORD: secret
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      # Vault — sem datasource separado em dev: usa mesmo banco com schema ng_vault
      VAULT_DB_URL: jdbc:postgresql://postgres:5432/neurogen
      VAULT_DB_USERNAME: neurogen
      VAULT_DB_PASSWORD: secret
      VAULT_DB_POOL_SIZE: 5
      # AES-256 — OBRIGATÓRIO: gere com: openssl rand -hex 32
      SENSITIVE_DATA_KEY: ${SENSITIVE_DATA_KEY}
      PORT: 8080
    networks:
      - neurogen-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Frontend React (Nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_APP_ENV: production
        VITE_MOCK: "false"
    container_name: neurogen-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - neurogen-net
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ── Redes ─────────────────────────────────────────────────────────────────────
networks:
  neurogen-net:
    driver: bridge
